<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist hồ sơ · Giáo Sư Cùi Bắp</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="workspace.css"></head>
<body class="workspace"><aside id="workspace-nav" class="ws-sidebar"></aside><main id="main">
<div class="ws-topbar"><div class="breadcrumb">Kho gói đã lưu <span data-icon="chevron"></span><b>Checklist hồ sơ</b></div><a href="dashboard.html" class="btn light">Về kho gói</a></div>
<section class="ws-intro"><div><div class="ws-kicker">BƯỚC 4 · CHUẨN BỊ HỒ SƠ</div><h1>Theo dõi từng việc.<br><em>Rõ người phụ trách.</em></h1><p>Checklist của các gói trong kho trên máy này. Không phụ thuộc lượt tìm đã mở trước đó.</p></div></section>
