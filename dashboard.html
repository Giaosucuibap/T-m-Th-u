<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giáo Sư Cùi Bắp</title><link rel="stylesheet" href="app.css"></head><body><header><b>📡 Giáo Sư Cùi Bắp</b><a href="dashboard.html">Tổng quan</a><a href="options.html">Cấu hình</a><a href="diagnostics.html">Chẩn đoán</a><a href="onboarding.html">Hướng dẫn</a></header><main>
<div class="row space mobile-stack"><div><h1 style="margin-bottom:5px">Radar gói thầu xây lắp</h1><div class="muted">Không Python · Không localhost · Không đăng nhập email · Dùng Chrome thật</div></div><div class="row mobile-stack"><button id="scan" class="btn">🔎 Quét e-GP ngay</button><button id="openEgp" class="btn secondary">Mở e-GP</button></div></div>
<div id="banner" class="notice" style="margin:14px 0"></div>
<div class="grid"><div class="card"><div class="muted">Tổng đã lưu</div><div id="total" class="metric">0</div></div><div class="card"><div class="muted">Gói đạt ngưỡng</div><div id="matched" class="metric">0</div></div><div class="card"><div class="muted">Điểm ≥ 85</div><div id="urgent" class="metric">0</div></div><div class="card"><div class="muted">Đang theo dõi</div><div id="watch" class="metric">0</div></div></div>
<div class="card" style="margin-top:14px"><div class="row space"><div><b>Yêu cầu đang tìm</b><div id="requirementInfo" class="muted small"></div></div><a class="btn light" href="options.html">Chỉnh yêu cầu</a></div></div>
<div class="card" style="margin-top:14px"><div class="row space"><div><b>Bộ lọc e-GP đã ghi nhớ</b><div id="templateInfo" class="muted small"></div></div><div class="row"><button id="saveTemplate" class="btn light">Lưu bộ lọc vừa tìm</button><button id="openGuide" class="btn light">Cách ghi bộ lọc</button></div></div></div>
<div class="card" style="margin-top:14px"><div class="form-grid"><div><label>Tìm kiếm</label><input id="q" placeholder="Tên gói, mã TBMT, địa bàn, chủ đầu tư..."></div><div><label>Điểm tối thiểu</label><select id="minScore"><option value="0">Tất cả</option><option value="55">≥ 55</option><option value="70">≥ 70</option><option value="85">≥ 85</option></select></div><div><label><input id="onlyMatched" type="checkbox" style="width:auto"> Chỉ gói đạt ngưỡng</label></div><div><label><input id="onlyWatch" type="checkbox" style="width:auto"> Chỉ danh sách theo dõi</label></div></div><div class="row" style="margin-top:12px"><button id="csv" class="btn light">Xuất Excel (.xlsx)</button><button id="mobile" class="btn light">Xuất báo cáo điện thoại</button><button id="backup" class="btn light">Sao lưu dữ liệu</button></div></div>
<div class="row space" style="margin-top:18px"><h2 style="margin:0">Danh sách gói thầu</h2><span id="count" class="pill">0 gói</span></div><div id="list"></div>
</main><script type="module" src="dashboard.js"></script>  <script src="logo.js"></script>
</body></html>
