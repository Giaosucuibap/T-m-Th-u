<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hợp đồng tương tự — Giáo Sư Cùi Bắp</title>
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="workspace.css"><link rel="icon" href="icons/icon32.png">
</head>
<body class="workspace">
<aside id="workspace-nav" class="ws-sidebar"></aside>
<main id="main">
  <div class="ws-topbar"><div class="breadcrumb"><span>Không gian</span><b>Hợp đồng tương tự</b></div></div>
  <section class="ws-intro"><div><h1>Hợp đồng đã làm.<br><em>Đối chiếu gói mới.</em></h1><p>Lưu hợp đồng thật để gợi ý gói gần loại việc và quy mô. Đối chiếu từng điều kiện trong HSMT trước khi xác nhận phù hợp.</p></div></section>
  <div id="alert" class="notice hidden"></div>
  <form id="form" class="card search-grid">
    <div><label>Tên / nội dung HĐ</label><input id="name" required maxlength="240" placeholder="Thi công kênh mương xã A"></div>
    <div><label>Loại việc</label><select id="workType">
      <option value="thuy-loi">Thủy lợi</option>
      <option value="giao-thong">Giao thông</option>
      <option value="cap-thoat">Cấp thoát nước</option>
      <option value="ke-bo">Kè bờ</option>
      <option value="dan-dung">Dân dụng</option>
    </select></div>
    <div><label>Giá HĐ (đồng)</label><input id="price" inputmode="numeric"></div>
    <div><label>Năm</label><input id="year" inputmode="numeric" placeholder="2024"></div>
    <div><label>Tỉnh</label><input id="province"></div>
    <div><label>Mốc năm đối chiếu nội bộ (tùy chọn)</label><input id="windowYears" type="number" min="1" max="30" placeholder="Nhập theo HSMT đang xem"><p class="muted small">Ước tính theo cuối năm HĐ. Không tự xác định thời hạn hợp lệ của hợp đồng.</p></div>
    <div class="full"><label>Tự rà soát hồ sơ công ty</label>
      <label>HĐ tương tự <select id="g-similar"><option value="chua">Chưa rà soát</option><option value="dat">Đã tự rà soát</option><option value="thieu">Cần bổ sung</option></select></label>
      <label>Nhân sự <select id="g-staff"><option value="chua">Chưa rà soát</option><option value="dat">Đã tự rà soát</option><option value="thieu">Cần bổ sung</option></select></label>
      <label>Thiết bị <select id="g-equip"><option value="chua">Chưa rà soát</option><option value="dat">Đã tự rà soát</option><option value="thieu">Cần bổ sung</option></select></label>
      <label>Tài chính <select id="g-finance"><option value="chua">Chưa rà soát</option><option value="dat">Đã tự rà soát</option><option value="thieu">Cần bổ sung</option></select></label>
    </div>
  </form>
  <div class="card"><label>Dán văn bản đã sao chép từ HSMT để nhận diện các mục được nhắc</label>
    <textarea id="hsmt" rows="4" placeholder="nhân sự chủ chốt, thiết bị thi công, hợp đồng tương tự…"></textarea>
    <p><button class="btn light" id="parse" type="button">Nhận diện mục trong văn bản</button></p>
    <p id="hsmt-out" class="muted small"></p></div>
  <p><button class="btn" id="save" type="button">Lưu hợp đồng</button></p>
  <div id="list"></div>
</main>
<script type="module" src="shell.js"></script>
<script type="module" src="contracts-page.js"></script>
</body></html>
