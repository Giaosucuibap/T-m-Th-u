<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Giáo Sư Cùi Bắp</title>
  <desc id="desc">Radar cơ hội đấu thầu với dấu kiểm</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="438" y2="464" gradientUnits="userSpaceOnUse">
