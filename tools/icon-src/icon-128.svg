<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#12314a"/>
      <stop offset="55%" stop-color="#0d2233"/>
      <stop offset="100%" stop-color="#071722"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Vệt quét radar: sáng ở cạnh dẫn, tan dần về sau -->
    <linearGradient id="sweep" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5eead4" stop-opacity=".85"/>
      <stop offset="45%"  stop-color="#2dd4bf" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blip" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#fde68a"/>
      <stop offset="70%"  stop-color="#f59e0b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dial"><circle cx="64" cy="64" r="42"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#plate)"/>
  <rect width="128" height="128" rx="28" fill="url(#rim)"/>

  <!-- Mặt radar -->
  <circle cx="64" cy="64" r="42" fill="#0a1a27"/>
  <g clip-path="url(#dial)">
    <path d="M64 64 L64 18 A46 46 0 0 1 104 44 Z" fill="url(#sweep)"/>
  </g>

  <!-- Ba vòng cự ly + trục -->
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round">
    <circle cx="64" cy="64" r="42" stroke-opacity=".95" stroke-width="5"/>
    <circle cx="64" cy="64" r="29" stroke-opacity=".45" stroke-width="3"/>
    <circle cx="64" cy="64" r="16" stroke-opacity=".30" stroke-width="2.5"/>
    <path d="M64 26 L64 102 M26 64 L102 64" stroke-opacity=".16" stroke-width="2"/>
  </g>

  <!-- Kim quét -->
  <path d="M64 64 L100 42" stroke="#5eead4" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Gói thầu bắt được -->
  <circle cx="86" cy="50" r="15" fill="url(#blip)"/>
  <circle cx="86" cy="50" r="6"  fill="#fbbf24"/>
  <circle cx="86" cy="50" r="2.6" fill="#fffbeb"/>
</svg>
