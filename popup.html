<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Giáo Sư Cùi Bắp</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
    --brand:#0f766e; --brand-ink:#ffffff; --chip:#e2e8f0; --chip-ink:#0f172a;
    --good:#15803d; --warn:#b45309; --bad:#b91c1c; --shadow:0 6px 22px rgba(15,23,42,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --panel:#0f172a; --border:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
      --brand:#2dd4bf; --brand-ink:#04211c; --chip:#1e293b; --chip-ink:#e2e8f0; --shadow:0 6px 22px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  body{font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;width:420px;margin:0;background:var(--bg);color:var(--text)}

  /* LOGO CHÌM — popup có kiểu riêng nên phải khai lại (xem app.css).
     Cửa sổ chỉ rộng 420px nên logo để nhỏ hơn và nhạt hơn các trang lớn. */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--watermark-image,url("icons/logo.png")) no-repeat center 60%/300px auto;
    opacity:.05;
  }
  /* Nền tối thì logo sáng màu nổi hơn, phải nhạt thêm. */
  @media (prefers-color-scheme: dark){ body::before{opacity:.07} }
  header,main,.nav,.footer{position:relative;z-index:1}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border)}
  header .logo{font-size:20px}
  header h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:11px;color:var(--muted)}
  main{padding:12px 16px 16px}
  .row{display:flex;gap:8px;align-items:center}
  .grow{flex:1}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  .status{margin:0 0 10px;font-size:13px}
  .status b{font-size:15px}
  .btn{border:0;border-radius:10px;padding:11px 12px;font-weight:800;cursor:pointer;background:var(--brand);color:var(--brand-ink);transition:transform .05s ease,opacity .15s}
  .btn:hover{opacity:.94}.btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5;cursor:progress}
  .btn.block{width:100%;padding:13px;font-size:15px}
  .btn.ghost{background:var(--chip);color:var(--chip-ink);font-weight:700}
  .btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
  .toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0 8px}
  input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);border:1px solid transparent;cursor:pointer;user-select:none}
  .chip.active{background:var(--brand);color:var(--brand-ink);font-weight:700}
  .tpls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tpl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink);cursor:pointer;max-width:100%}
  .tpl.active{background:var(--brand);color:var(--brand-ink);font-weight:700}
  .tpl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .tpl .del{opacity:.7;font-weight:700}
  .count{font-size:12px;color:var(--muted);margin:2px 2px 8px}
  #list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding-right:2px}
  .tender{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 11px}
  .tender .top{display:flex;gap:10px;align-items:flex-start}
  .score{min-width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;line-height:1}
  .score small{font-size:9px;font-weight:700;opacity:.9}
  .s-hi{background:#15803d}.s-mid{background:#0f766e}.s-lo{background:#64748b}
  .tender h3{margin:0 0 2px;font-size:13.5px;font-weight:700}
  .meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
  .tender .line{margin-top:6px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .rec{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
  .actions{display:flex;gap:6px;margin-top:9px;align-items:center}
  a.open{font-weight:800;color:var(--brand);text-decoration:none;font-size:12.5px}
  a.open:hover{text-decoration:underline}
  .star{margin-left:auto;cursor:pointer;font-size:16px;background:none;border:0;color:var(--muted)}
  .star.on{color:#f59e0b}
  .group{position:sticky;top:0;z-index:1;font-size:11.5px;font-weight:800;letter-spacing:.2px;
         padding:6px 10px;border-radius:8px;margin:4px 0 2px;background:var(--chip);color:var(--chip-ink)}
  .group.g-open{background:#15803d;color:#fff}
  .group.g-plan{background:#b45309;color:#fff}
  .group.g-unknown{background:#64748b;color:#fff}
  .group.g-closed{background:var(--chip);color:var(--muted)}
  .nav{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .nav-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  .navbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
          border:1px solid var(--border);border-radius:11px;padding:9px 11px;background:var(--panel);color:var(--text)}
  .navbtn:hover{border-color:var(--brand);background:var(--chip)}
  .navbtn b{font-size:13px;font-weight:800}
  .navbtn small{font-size:11px;color:var(--muted);line-height:1.35}
  .empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}
  .footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .note{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
  .bar{height:4px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:8px;display:none}
  .bar.on{display:block}.bar i{display:block;height:100%;width:40%;background:var(--brand);animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body>
  <header>
    <span class="logo">📡</span>
    <div class="grow">
      <h1>Giáo Sư Cùi Bắp</h1>
      <div class="sub">Tự động tìm &amp; trích xuất gói thầu trên e-GP</div>
    </div>
    <button id="settings" class="btn ghost sm" title="Cấu hình bộ lọc">⚙</button>
  </header>

  <main>
    <div class="card">
      <p id="status" class="status">Đang đọc trạng thái…</p>
      <button id="scan" class="btn block">🔍 Quét &amp; trích xuất tất cả gói thầu</button>
      <div id="bar" class="bar"><i></i></div>
      <button id="scanAll" class="btn ghost sm" style="width:100%;margin-top:6px;display:none">🔁 Quét tất cả bộ lọc</button>
      <div id="templates" class="tpls"></div>
      <div class="row" style="margin-top:8px">
        <button id="save" class="btn ghost sm grow">💾 Lưu bộ lọc vừa tìm</button>
        <button id="open" class="btn ghost sm grow">🌐 Mở e-GP</button>
      </div>
    </div>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Lọc theo tên gói, tỉnh, chủ đầu tư, mã TBMT…">
      <select id="minScore" title="Điểm phù hợp tối thiểu">
        <option value="0">Mọi điểm</option>
        <option value="55">≥ 55</option>
        <option value="70">≥ 70</option>
        <option value="85">≥ 85</option>
      </select>
    </div>
    <div class="filters">
      <span class="chip" data-f="matched">✔ Đạt ngưỡng</span>
      <span class="chip" data-f="construction">🏗 Xây lắp</span>
      <span class="chip" data-f="open">⏳ Còn nộp được</span>
      <span class="chip" data-f="watch">⭐ Theo dõi</span>
    </div>
    <div id="count" class="count"></div>
    <div id="list"></div>

    <div class="nav">
      <div class="nav-title">Các chức năng chính</div>
      <button id="scanTop" class="navbtn"><b>1 · Tìm thông báo mời thầu</b><small>Chọn chủ đầu tư, tỉnh, xã/phường, từ khoá và khoảng giá rồi tra trên e-GP</small></button>
      <button id="winners" class="navbtn"><b>2 · Nhà thầu trúng thầu</b><small>Thống kê toàn bộ theo mã số thuế hoặc tên công ty</small></button>
      <button id="bidopen" class="navbtn"><b>3 · Gói đang chờ kết quả</b><small>Ai đang dự thầu và tỷ lệ % giảm giá của từng nhà thầu</small></button>
      <button id="plans" class="navbtn"><b>4 · Kế hoạch lựa chọn nhà thầu</b><small>Theo chủ đầu tư, tỉnh và xã/phường</small></button>
      <button id="market" class="navbtn"><b>5 · Soi địa bàn</b><small>Xã/phường này hay có công ty nào trúng, và trúng của chủ đầu tư nào</small></button>
      <button id="profile" class="navbtn"><b>6 · Hồ sơ 360° nhà thầu</b><small>Lịch sử trúng thầu, địa bàn, bên mời thầu, theo từng năm</small></button>
      <button id="investor" class="navbtn"><b>7 · Hồ sơ chủ đầu tư</b><small>Đơn vị này tổ chức bao nhiêu gói, nhà thầu nào hay trúng</small></button>
    </div>
    <button id="analytics" class="btn block" style="margin-top:8px">📊 Phân tích dữ liệu đấu thầu</button>
    <button id="contractors" class="btn ghost sm" style="width:100%;margin-top:8px">🏢 Nhà thầu trong dữ liệu đã quét</button>
    <button id="iphone" class="btn ghost sm" style="width:100%;margin-top:6px">📱 Dùng trên iPhone (Safari)</button>
    <div class="footer">
      <button id="csv" class="btn ghost sm">⬇ Xuất Excel (.xlsx)</button>
      <button id="mobile" class="btn ghost sm">📱 Báo cáo điện thoại</button>
      <button id="dashboard" class="btn ghost sm">📊 Bảng điều khiển</button>
      <button id="egp2" class="btn ghost sm">↻ Làm mới</button>
    </div>
    <div class="note">Tiện ích không lưu tài khoản/mật khẩu e-GP. Dữ liệu nằm trên máy bạn. <span id="ver"></span></div>
  </main>

  <script src="popup.js"></script>
  <script src="logo.js"></script>
</body>
</html>
